
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: reality_engine
      POSTGRES_USER: reality
      POSTGRES_PASSWORD: change-me-in-production
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U reality -d reality_engine"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes"]
    volumes: [redisdata:/data]
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: reality
      MINIO_ROOT_PASSWORD: change-me-in-production
    volumes: [miniodata:/data]
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://reality:change-me-in-production@postgres:5432/reality_engine
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORE_URL: http://minio:9000
    ports: ["8787:8787"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
volumes: {pgdata: {}, redisdata: {}, miniodata: {}}
